# CI: sidecar tests + app tests on every push/PR, packaged mac/win builds
# with the bundled sidecar as uploadable artifacts.
#
# Prerequisites (first run after the repo lands on GitHub):
#   - The submodules third_party/vtracer and third_party/visioncortex must be
#     pushed to github.com/latentspacelabs and readable with this repo's
#     GITHUB_TOKEN (public, or same-org private with access). actions/checkout
#     rewrites the git@github.com: submodule URLs to token-authenticated https.
#
# Releases ship UNSIGNED by design (the $0 open-source route — see
# docs/build-and-release.md): mac gets an ad-hoc signature with the hardened
# runtime off and no notarization (Gatekeeper wall on first launch of a
# downloaded copy; Homebrew-cask installs open clean), win an unsigned
# installer (SmartScreen "unknown publisher", click-through-able). To
# re-enable signing later (e.g. SignPath Foundation for win, an Apple
# Developer cert for mac): unpin mac.identity (null in vue.config.js and
# electron-builder.json), restore an afterSign notarize hook, and resurrect
# the CSC_LINK plumbing + eSigner CKA step from git history (pre-2026-07-28).
#
# Not yet in CI: the verify_* golden harnesses (the multi-GB golden dirs have
# no durable home yet) and EP runtime checks (CoreML/DirectML need real
# hardware). CPU-only `cargo test` covers the ported algorithms.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run — private-repo
# runner minutes are metered (macOS 10x, Windows 2x). Tag runs get their
# own group so a release build is never cancelled by a later branch push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar-test:
    name: sidecar tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serving/sidecar
          shared-key: sidecar
      - name: cargo test
        working-directory: serving/sidecar
        run: cargo test --release

  app-test:
    name: app unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      - name: jest
        working-directory: app
        run: npx jest

  package-mac:
    name: package mac (arm64)
    needs: [sidecar-test, app-test]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serving/sidecar
          shared-key: sidecar
      - name: Build sidecar (release)
        working-directory: serving/sidecar
        run: cargo build --release --bin cadmium-sidecar
      - name: Fetch ONNX Runtime dylib (load-dynamic)
        run: serving/sidecar/scripts/fetch-ort-dylib.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      # Builds are intentionally unsigned (the $0 route): mac.identity is
      # pinned null in the builder config, so packaging always produces an
      # ad-hoc-signed, un-notarized app — release tags included. See the
      # header comment.
      - name: Package
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:build -- --mac --arm64 --publish never
      # *.yml = electron-updater feed metadata (latest-mac.yml), needed as a
      # release asset for in-app updates.
      - uses: actions/upload-artifact@v4
        with:
          name: cadmium-mac-arm64
          retention-days: 7
          path: |
            app/dist_electron/*.dmg
            app/dist_electron/*.zip
            app/dist_electron/*.yml
          if-no-files-found: error

  package-win:
    name: package windows (x64)
    needs: [sidecar-test, app-test]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serving/sidecar
          shared-key: sidecar
      # Explicit --target so the binary lands where vue.config.js
      # extraResources expects it (target/x86_64-pc-windows-msvc/release/).
      - name: Build sidecar (release, x64 MSVC)
        working-directory: serving/sidecar
        run: cargo build --release --bin cadmium-sidecar --target x86_64-pc-windows-msvc
      # The DML EP dlopens DirectML.dll at runtime; the system one (1.4.0 on the
      # Server 2022 image) is too old and fails session creation, dropping the
      # sidecar to CPU. Ship Microsoft's modern redist next to the sidecar exe.
      - name: Fetch DirectML runtime (DML EP)
        working-directory: serving/sidecar
        shell: powershell
        run: ./scripts/fetch-directml.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      # Builds are intentionally unsigned (the $0 route) — the SSL.com
      # eSigner CKA signing step that used to live here is in git history
      # (pre-2026-07-28) if Windows signing ever returns.
      # win-node-env (a dependency) makes the NODE_ENV=... script prefix work
      # under cmd.exe, so the same npm script runs on Windows unchanged.
      - name: Package
        working-directory: app
        shell: bash
        run: npm run electron:build -- --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cadmium-win-x64
          retention-days: 7
          path: |
            app/dist_electron/*.exe
            app/dist_electron/*.blockmap
            app/dist_electron/*.yml
          if-no-files-found: error

  # Pushing a v* tag runs the full pipeline above, then drafts a GitHub
  # Release on this repo with the packaged builds attached. Draft on
  # purpose: review, write notes, hit publish. electron-updater only sees
  # published releases (its feed is the publish config in
  # electron-builder.json). Unsigned builds ship if signing secrets are
  # absent. Model artifacts live on a separate, hand-managed release —
  # see serving/tools/upload_models_release.sh.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-mac, package-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
